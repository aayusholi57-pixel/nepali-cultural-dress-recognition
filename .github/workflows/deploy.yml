name: Continuous Deployment to EC2

on:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: nepali-cultural-dress-deployment
  cancel-in-progress: true

jobs:
  deploy:
    name: Deploy to EC2
    runs-on: ubuntu-latest

    steps:
      # ======================================================
      # 1. Checkout repository
      # ======================================================
      - name: Checkout Code
        uses: actions/checkout@v7

      # ======================================================
      # 2. Deploy to EC2
      # ======================================================
      - name: Deploy Application to EC2
        uses: appleboy/ssh-action@v1.2.5
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USERNAME }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script_stop: true

          script: |
            set -e

            echo "=========================================="
            echo "STARTING DEPLOYMENT"
            echo "=========================================="

            APP_DIR="$HOME/nepali-cultural-dress-recognition"
            REPO_URL="https://github.com/${{ github.repository }}.git"

            CONTAINER_NAME="nepali_dress_api"
            IMAGE_NAME="nepali-dress-api:latest"

            # ==================================================
            # 1. Docker / disk information
            # ==================================================
            echo "=========================================="
            echo "DOCKER STATUS"
            echo "=========================================="

            sudo docker version
            sudo docker ps -a
            df -h

            # ==================================================
            # 2. Remove old Nepali Dress container
            # ==================================================
            echo "=========================================="
            echo "CLEANING PREVIOUS CONTAINER"
            echo "=========================================="

            OLD_CONTAINER_ID=$(sudo docker ps -aq \
              --filter "name=^/${CONTAINER_NAME}$" || true)

            if [ -n "$OLD_CONTAINER_ID" ]; then
              echo "Found existing container: $OLD_CONTAINER_ID"

              echo "Stopping existing container..."
              sudo docker stop "$OLD_CONTAINER_ID" 2>/dev/null || true

              echo "Removing existing container..."
              sudo docker rm -f "$OLD_CONTAINER_ID" 2>/dev/null || true
            else
              echo "No existing Nepali Dress container found."
            fi

            # ==================================================
            # 3. Verify container name is free
            # ==================================================
            echo "=========================================="
            echo "VERIFYING CONTAINER NAME"
            echo "=========================================="

            REMAINING_CONTAINER=$(sudo docker ps -aq \
              --filter "name=^/${CONTAINER_NAME}$" || true)

            if [ -n "$REMAINING_CONTAINER" ]; then
              echo "ERROR: Container name is still occupied."
              sudo docker inspect "$REMAINING_CONTAINER" || true
              exit 1
            fi

            echo "Container name is available."

            # ==================================================
            # 4. Remove only old Nepali Dress image
            # ==================================================
            echo "=========================================="
            echo "REMOVING OLD IMAGE"
            echo "=========================================="

            sudo docker image rm "$IMAGE_NAME" 2>/dev/null || true

            # ==================================================
            # 5. Clean Docker build cache
            # ==================================================
            echo "=========================================="
            echo "CLEANING DOCKER BUILD CACHE"
            echo "=========================================="

            sudo docker builder prune -af || true

            # ==================================================
            # 6. Remove old application directory
            # ==================================================
            echo "=========================================="
            echo "REMOVING OLD APPLICATION DIRECTORY"
            echo "=========================================="

            if [ -d "$APP_DIR" ]; then
              echo "Removing old application directory..."
              rm -rf "$APP_DIR"
            else
              echo "No previous application directory found."
            fi

            # ==================================================
            # 7. Clone latest GitHub repository
            # ==================================================
            echo "=========================================="
            echo "CLONING LATEST GITHUB REPOSITORY"
            echo "=========================================="

            git clone \
              --branch main \
              --single-branch \
              "$REPO_URL" \
              "$APP_DIR"

            cd "$APP_DIR"

            # ==================================================
            # 8. Show deployed commit
            # ==================================================
            echo "=========================================="
            echo "DEPLOYED COMMIT"
            echo "=========================================="

            git log -1 --oneline

            # ==================================================
            # 9. Verify required files
            # ==================================================
            echo "=========================================="
            echo "CHECKING PROJECT FILES"
            echo "=========================================="

            test -f Dockerfile
            test -f requirements-docker.txt
            test -f requirements.txt
            test -f api/__init__.py
            test -f api/main.py
            test -f api/predictor.py
            test -f api/schemas.py
            test -f src/__init__.py
            test -f src/model.py

            echo "All required files found."

            # ==================================================
            # 10. Verify deployment model configuration
            # ==================================================
            echo "=========================================="
            echo "CHECKING MODEL CONFIGURATION"
            echo "=========================================="

            if grep -q "pretrained=False" api/predictor.py; then
              echo "Predictor correctly uses pretrained=False."
            else
              echo "ERROR: api/predictor.py does not contain pretrained=False."
              exit 1
            fi

            if grep -q "pretrained:" src/model.py; then
              echo "Model supports pretrained parameter."
            else
              echo "ERROR: src/model.py does not support pretrained parameter."
              exit 1
            fi

            if grep -q "torch==2.14.1+cpu" requirements-docker.txt; then
              echo "CPU-only PyTorch configuration detected."
            else
              echo "ERROR: CPU-only PyTorch version not found."
              exit 1
            fi

            # ==================================================
            # 11. Build Docker image
            # ==================================================
            echo "=========================================="
            echo "BUILDING DOCKER IMAGE"
            echo "=========================================="

            sudo docker build \
              --pull \
              -t "$IMAGE_NAME" \
              .

            echo "Docker image built successfully."

            # ==================================================
            # 12. Start container
            # ==================================================
            echo "=========================================="
            echo "STARTING CONTAINER"
            echo "=========================================="

            sudo docker run -d \
              --name "$CONTAINER_NAME" \
              -p 9000:8000 \
              --restart unless-stopped \
              -e AWS_DEFAULT_REGION=ap-southeast-2 \
              -e AWS_REGION=ap-southeast-2 \
              "$IMAGE_NAME"

            echo "Container started."

            # ==================================================
            # 13. Show container status
            # ==================================================
            echo "=========================================="
            echo "CONTAINER STATUS"
            echo "=========================================="

            sudo docker ps -a \
              --filter "name=^/${CONTAINER_NAME}$"

            # ==================================================
            # 14. Health check with retry
            # ==================================================
            echo "=========================================="
            echo "HEALTH CHECK"
            echo "=========================================="

            MAX_RETRIES=18
            RETRY_COUNT=0
            HEALTH_CHECK_PASSED=false

            while [ "$RETRY_COUNT" -lt "$MAX_RETRIES" ]; do

              echo "Health check attempt $((RETRY_COUNT + 1))/$MAX_RETRIES..."

              if HEALTH_RESPONSE=$(curl \
                --fail \
                --silent \
                --show-error \
                --max-time 10 \
                http://127.0.0.1:9000/health); then

                echo "Health response:"
                echo "$HEALTH_RESPONSE"

                if echo "$HEALTH_RESPONSE" | grep -q '"model_loaded":true'; then
                  HEALTH_CHECK_PASSED=true
                  echo "Health check passed."
                  break
                else
                  echo "API responded, but model is not loaded yet."
                fi

              else
                echo "API is not ready yet."
              fi

              # =================================================
              # Check whether container is still running
              # =================================================
              if ! sudo docker ps \
                --format '{{.Names}}' \
                | grep -q "^${CONTAINER_NAME}$"; then

                echo "ERROR: Container is no longer running."

                echo "=========================================="
                echo "CONTAINER LOGS"
                echo "=========================================="

                sudo docker logs \
                  "$CONTAINER_NAME" \
                  --tail 100 || true

                exit 1
              fi

              RETRY_COUNT=$((RETRY_COUNT + 1))

              echo "Waiting 10 seconds before retry..."
              sleep 10
            done

            # ==================================================
            # 15. Fail if health check never passed
            # ==================================================
            if [ "$HEALTH_CHECK_PASSED" = false ]; then

              echo "=========================================="
              echo "HEALTH CHECK FAILED"
              echo "=========================================="

              echo "Container status:"
              sudo docker ps -a \
                --filter "name=^/${CONTAINER_NAME}$"

              echo "Container logs:"
              sudo docker logs \
                "$CONTAINER_NAME" \
                --tail 150 || true

              exit 1
            fi

            # ==================================================
            # 16. Model information
            # ==================================================
            echo "=========================================="
            echo "MODEL INFORMATION"
            echo "=========================================="

            curl \
              --fail \
              --silent \
              --show-error \
              --max-time 10 \
              http://127.0.0.1:9000/model-info

            echo

            # ==================================================
            # 17. Final application logs
            # ==================================================
            echo "=========================================="
            echo "APPLICATION LOGS"
            echo "=========================================="

            sudo docker logs \
              "$CONTAINER_NAME" \
              --tail 50

            # ==================================================
            # 18. Final Docker cleanup
            # ==================================================
            echo "=========================================="
            echo "DOCKER CLEANUP"
            echo "=========================================="

            sudo docker image prune -f

            echo "=========================================="
            echo "FINAL CONTAINER STATUS"
            echo "=========================================="

            sudo docker ps \
              --filter "name=^/${CONTAINER_NAME}$"

            echo "=========================================="
            echo "DEPLOYMENT SUCCESSFUL"
            echo "=========================================="