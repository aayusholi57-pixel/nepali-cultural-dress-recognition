name: Continuous Deployment to EC2

on:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  deploy:
    name: Deploy to EC2
    runs-on: ubuntu-latest

    steps:

      # ======================================================
      # 1. Checkout GitHub repository
      # ======================================================

      - name: Checkout Code
        uses: actions/checkout@v7

      # ======================================================
      # 2. Deploy to EC2
      # ======================================================

      - name: Deploy Application to EC2
        uses: appleboy/ssh-action@v1.2.5

        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USERNAME }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script_stop: true

          script: |

            set -e

            echo "=========================================="
            echo "STARTING DEPLOYMENT"
            echo "=========================================="

            APP_DIR="$HOME/nepali-cultural-dress-recognition"
            REPO_URL="https://github.com/${{ github.repository }}.git"

            # ------------------------------------------------
            # Create application directory if needed
            # ------------------------------------------------

            mkdir -p "$APP_DIR"

            cd "$APP_DIR"

            # ------------------------------------------------
            # Initialize Git if this directory was created
            # manually before CI/CD was configured.
            # ------------------------------------------------

            if [ ! -d ".git" ]; then

              echo "Git repository not found."
              echo "Initializing existing application directory..."

              git init

              git remote add origin "$REPO_URL"

            else

              echo "Git repository already exists."

              git remote set-url origin "$REPO_URL"

            fi

            # ------------------------------------------------
            # Fetch latest GitHub code
            # ------------------------------------------------

            echo "Fetching latest main branch..."

            git fetch origin main

            # ------------------------------------------------
            # Force local tracked files to match GitHub
            #
            # Important:
            # data/ and .venv/ are untracked and are therefore
            # preserved.
            # ------------------------------------------------

            git checkout -B main origin/main

            git reset --hard origin/main

            echo "Latest code deployed:"
            git log -1 --oneline

            # ------------------------------------------------
            # Verify required files
            # ------------------------------------------------

            echo "Checking required files..."

            test -f Dockerfile
            test -f requirements-docker.txt
            test -f requirements.txt
            test -f api/main.py
            test -f api/predictor.py
            test -f api/schemas.py
            test -f src/model.py

            echo "Required files found."

            # ------------------------------------------------
            # Build Docker image
            # ------------------------------------------------

            echo "Building Docker image..."

            sudo docker build \
              -t nepali-dress-api:latest \
              .

            # ------------------------------------------------
            # Remove previous container
            # ------------------------------------------------

            echo "Removing previous container..."

            sudo docker rm -f nepali_dress_api 2>/dev/null || true

            # ------------------------------------------------
            # Start new container
            # ------------------------------------------------

            echo "Starting new container..."

            sudo docker run -d \
              --name nepali_dress_api \
              -p 9000:8000 \
              --restart unless-stopped \
              -e AWS_DEFAULT_REGION=ap-southeast-2 \
              -e AWS_REGION=ap-southeast-2 \
              nepali-dress-api:latest

            # ------------------------------------------------
            # Wait for FastAPI startup
            # ------------------------------------------------

            echo "Waiting for API startup..."

            sleep 20

            # ------------------------------------------------
            # Container status
            # ------------------------------------------------

            echo "Container status:"

            sudo docker ps \
              --filter "name=nepali_dress_api"

            # ------------------------------------------------
            # Health check
            # ------------------------------------------------

            echo "Running health check..."

            HEALTH_RESPONSE=$(curl \
              --fail \
              --silent \
              http://127.0.0.1:9000/health)

            echo "Health response:"
            echo "$HEALTH_RESPONSE"

            # ------------------------------------------------
            # Verify model loaded
            # ------------------------------------------------

            echo "$HEALTH_RESPONSE" | grep \
              '"model_loaded":true'

            # ------------------------------------------------
            # Show logs
            # ------------------------------------------------

            echo "Recent application logs:"

            sudo docker logs \
              nepali_dress_api \
              --tail 40

            # ------------------------------------------------
            # Remove unused Docker layers
            # ------------------------------------------------

            echo "Cleaning unused Docker images..."

            sudo docker image prune -f

            echo "=========================================="
            echo "DEPLOYMENT SUCCESSFUL"
            echo "=========================================="