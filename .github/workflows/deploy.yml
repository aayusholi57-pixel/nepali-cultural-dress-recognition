name: Continuous Deployment to EC2

on:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  deploy:
    name: Deploy to EC2
    runs-on: ubuntu-latest

    steps:

      # ======================================================
      # 1. Checkout repository
      # ======================================================

      - name: Checkout Code
        uses: actions/checkout@v7

      # ======================================================
      # 2. Deploy to EC2
      # ======================================================

      - name: Deploy Application to EC2
        uses: appleboy/ssh-action@v1.2.5
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USERNAME }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script_stop: true

          script: |

            set -e

            echo "=========================================="
            echo "STARTING DEPLOYMENT"
            echo "=========================================="

            APP_DIR="$HOME/nepali-cultural-dress-recognition"
            REPO_URL="https://github.com/${{ github.repository }}.git"

            # ------------------------------------------------
            # Stop/remove previous container
            # ------------------------------------------------

            echo "Removing previous container..."

            sudo docker rm -f nepali_dress_api 2>/dev/null || true

            # ------------------------------------------------
            # Remove old manually-created application directory
            # ------------------------------------------------

            if [ -d "$APP_DIR" ]; then

              echo "Removing old application directory..."

              rm -rf "$APP_DIR"

            fi

            # ------------------------------------------------
            # Clone latest repository
            # ------------------------------------------------

            echo "Cloning latest GitHub repository..."

            git clone \
              --branch main \
              "$REPO_URL" \
              "$APP_DIR"

            cd "$APP_DIR"

            # ------------------------------------------------
            # Show deployed commit
            # ------------------------------------------------

            echo "=========================================="
            echo "DEPLOYED COMMIT"
            echo "=========================================="

            git log -1 --oneline

            # ------------------------------------------------
            # Verify required files
            # ------------------------------------------------

            echo "=========================================="
            echo "CHECKING PROJECT FILES"
            echo "=========================================="

            test -f Dockerfile
            test -f requirements-docker.txt
            test -f requirements.txt

            test -f api/main.py
            test -f api/predictor.py
            test -f api/schemas.py

            test -f src/model.py

            echo "All required files found."

            # ------------------------------------------------
            # Build Docker image
            # ------------------------------------------------

            echo "=========================================="
            echo "BUILDING DOCKER IMAGE"
            echo "=========================================="

            sudo docker build \
              -t nepali-dress-api:latest \
              .

            # ------------------------------------------------
            # Start container
            # ------------------------------------------------

            echo "=========================================="
            echo "STARTING CONTAINER"
            echo "=========================================="

            sudo docker run -d \
              --name nepali_dress_api \
              -p 9000:8000 \
              --restart unless-stopped \
              -e AWS_DEFAULT_REGION=ap-southeast-2 \
              -e AWS_REGION=ap-southeast-2 \
              nepali-dress-api:latest

            # ------------------------------------------------
            # Container status
            # ------------------------------------------------

            echo "=========================================="
            echo "CONTAINER STATUS"
            echo "=========================================="

            sudo docker ps \
              --filter "name=nepali_dress_api"

            # ------------------------------------------------
            # Health check with retry
            # ------------------------------------------------

            echo "=========================================="
            echo "HEALTH CHECK"
            echo "=========================================="

            MAX_RETRIES=18
            RETRY_COUNT=0
            HEALTH_CHECK_PASSED=false

            while [ "$RETRY_COUNT" -lt "$MAX_RETRIES" ]; do

              echo "Health check attempt $((RETRY_COUNT + 1))/$MAX_RETRIES..."

              if HEALTH_RESPONSE=$(curl \
                --fail \
                --silent \
                --show-error \
                http://127.0.0.1:9000/health); then

                echo "Health response:"
                echo "$HEALTH_RESPONSE"

                if echo "$HEALTH_RESPONSE" | grep -q '"model_loaded":true'; then

                  HEALTH_CHECK_PASSED=true

                  echo "Health check passed."

                  break

                fi

              else

                echo "API is not ready yet."

              fi

              # ------------------------------------------------
              # Check whether container is still running
              # ------------------------------------------------

              if ! sudo docker ps \
                --format '{{.Names}}' \
                | grep -q '^nepali_dress_api$'; then

                echo "ERROR: Container is no longer running."

                echo "Container logs:"

                sudo docker logs \
                  nepali_dress_api \
                  --tail 80

                exit 1

              fi

              RETRY_COUNT=$((RETRY_COUNT + 1))

              echo "Waiting 10 seconds before retry..."

              sleep 10

            done

            # ------------------------------------------------
            # Fail if health check never passed
            # ------------------------------------------------

            if [ "$HEALTH_CHECK_PASSED" = false ]; then

              echo "=========================================="
              echo "HEALTH CHECK FAILED"
              echo "=========================================="

              echo "Container status:"

              sudo docker ps -a \
                --filter "name=nepali_dress_api"

              echo "Container logs:"

              sudo docker logs \
                nepali_dress_api \
                --tail 100

              exit 1

            fi

            # ------------------------------------------------
            # Model information
            # ------------------------------------------------

            echo "=========================================="
            echo "MODEL INFORMATION"
            echo "=========================================="

            curl \
              --fail \
              --silent \
              http://127.0.0.1:9000/model-info

            echo

            # ------------------------------------------------
            # Final application logs
            # ------------------------------------------------

            echo "=========================================="
            echo "APPLICATION LOGS"
            echo "=========================================="

            sudo docker logs \
              nepali_dress_api \
              --tail 40

            # ------------------------------------------------
            # Docker cleanup
            # ------------------------------------------------

            echo "=========================================="
            echo "DOCKER CLEANUP"
            echo "=========================================="

            sudo docker image prune -f

            echo "=========================================="
            echo "DEPLOYMENT SUCCESSFUL"
            echo "=========================================="