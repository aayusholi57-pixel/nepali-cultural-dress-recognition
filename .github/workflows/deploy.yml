name: Continuous Deployment to EC2

on:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  deploy:
    name: Deploy to EC2
    runs-on: ubuntu-latest

    steps:

      # ======================================================
      # 1. Checkout GitHub repository
      # ======================================================

      - name: Checkout Code
        uses: actions/checkout@v7

      # ======================================================
      # 2. Deploy to EC2
      # ======================================================

      - name: Deploy Application to EC2
        uses: appleboy/ssh-action@v1.2.5

        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USERNAME }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script_stop: true

          script: |

            set -e

            echo "=========================================="
            echo "STARTING DEPLOYMENT"
            echo "=========================================="

            APP_DIR="$HOME/nepali-cultural-dress-recognition"
            BACKUP_DIR="$HOME/nepali-cultural-dress-recognition-backup"
            REPO_URL="https://github.com/${{ github.repository }}.git"

            # ------------------------------------------------
            # Stop old container
            # ------------------------------------------------

            echo "Stopping previous container..."

            sudo docker rm -f nepali_dress_api 2>/dev/null || true

            # ------------------------------------------------
            # Remove old manually-created project directory
            #
            # This removes the old EC2 copy containing data/,
            # .venv/, and manually copied files.
            #
            # The trained model is NOT stored here.
            # The model remains safely in S3.
            # ------------------------------------------------

            if [ -d "$APP_DIR" ]; then

              echo "Removing old application directory..."

              rm -rf "$APP_DIR"

            fi

            # ------------------------------------------------
            # Remove old backup if it exists
            # ------------------------------------------------

            if [ -d "$BACKUP_DIR" ]; then

              rm -rf "$BACKUP_DIR"

            fi

            # ------------------------------------------------
            # Clone clean repository
            # ------------------------------------------------

            echo "Cloning latest GitHub repository..."

            git clone \
              --branch main \
              "$REPO_URL" \
              "$APP_DIR"

            cd "$APP_DIR"

            # ------------------------------------------------
            # Show deployed commit
            # ------------------------------------------------

            echo "=========================================="
            echo "DEPLOYED COMMIT"
            echo "=========================================="

            git log -1 --oneline

            # ------------------------------------------------
            # Verify required files
            # ------------------------------------------------

            echo "=========================================="
            echo "CHECKING PROJECT FILES"
            echo "=========================================="

            test -f Dockerfile
            test -f requirements-docker.txt
            test -f requirements.txt

            test -f api/main.py
            test -f api/predictor.py
            test -f api/schemas.py

            test -f src/model.py

            echo "All required files found."

            # ------------------------------------------------
            # Build Docker image
            # ------------------------------------------------

            echo "=========================================="
            echo "BUILDING DOCKER IMAGE"
            echo "=========================================="

            sudo docker build \
              -t nepali-dress-api:latest \
              .

            # ------------------------------------------------
            # Start container
            # ------------------------------------------------

            echo "=========================================="
            echo "STARTING CONTAINER"
            echo "=========================================="

            sudo docker run -d \
              --name nepali_dress_api \
              -p 9000:8000 \
              --restart unless-stopped \
              -e AWS_DEFAULT_REGION=ap-southeast-2 \
              -e AWS_REGION=ap-southeast-2 \
              nepali-dress-api:latest

            # ------------------------------------------------
            # Wait for FastAPI + S3 model loading
            # ------------------------------------------------

            echo "Waiting for application startup..."

            sleep 20

            # ------------------------------------------------
            # Check container
            # ------------------------------------------------

            echo "=========================================="
            echo "CONTAINER STATUS"
            echo "=========================================="

            sudo docker ps \
              --filter "name=nepali_dress_api"

            # ------------------------------------------------
            # Health check
            # ------------------------------------------------

            echo "=========================================="
            echo "HEALTH CHECK"
            echo "=========================================="

            HEALTH_RESPONSE=$(curl \
              --fail \
              --silent \
              http://127.0.0.1:9000/health)

            echo "$HEALTH_RESPONSE"

            # ------------------------------------------------
            # Verify model loaded
            # ------------------------------------------------

            echo "$HEALTH_RESPONSE" | grep \
              '"model_loaded":true'

            # ------------------------------------------------
            # Show logs
            # ------------------------------------------------

            echo "=========================================="
            echo "APPLICATION LOGS"
            echo "=========================================="

            sudo docker logs \
              nepali_dress_api \
              --tail 40

            # ------------------------------------------------
            # Docker cleanup
            # ------------------------------------------------

            echo "=========================================="
            echo "DOCKER CLEANUP"
            echo "=========================================="

            sudo docker image prune -f

            echo "=========================================="
            echo "DEPLOYMENT SUCCESSFUL"
            echo "=========================================="